<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Mass Sender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: 'var(--text-base)',
              muted: 'var(--text-subdued)',
              shell: 'var(--bg-base)',
              line: 'var(--border-subtle)',
              brand: 'var(--brand-accent)',
              success: 'var(--brand-accent)',
              warn: 'var(--semantic-warning)',
              danger: 'var(--semantic-negative)',
              surface: 'var(--bg-surface)',
              elevated: 'var(--bg-elevated)',
              press: 'var(--bg-press)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      .login-bg {
        background-color: var(--bg-base);
        background-image:
          radial-gradient(ellipse 60% 40% at 50% 0%, rgba(62, 207, 142, 0.07) 0%, transparent 70%);
      }
      .login-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        box-shadow: 0 0 0 1px rgba(62,207,142,0.04), 0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
      }
      .login-monogram {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--brand-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        font-weight: 700;
        color: #000;
        letter-spacing: -0.5px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body class="login-bg flex min-h-screen items-center justify-center text-ink">
    {% include '_brand_masthead.html' %}
    <main class="w-full max-w-xs px-4">
      <div class="login-card p-8">

        <div class="brand-product-lockup" data-testid="mass-sender-product-mark" style="display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-bottom:24px;">
          <h2 class="sr-only">Mass Sender</h2>
          <img src="/static/brand/mass-sender-cofre-horizontal.svg" alt="Mass Sender" style="display:block;width:180px;height:40px;object-fit:contain;" />
        </div>

        <div class="mb-6">
          <h1 class="text-lg font-semibold text-ink">Acesso restrito</h1>
          <p class="mt-1 text-sm text-muted">Informe a senha para continuar.</p>
        </div>

        {% if error %}
        <div class="mb-5 rounded-lg border border-danger/20 bg-danger/5 px-3 py-2.5 text-sm text-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4">
          <label class="block space-y-1.5">
            <span class="text-xs font-medium uppercase tracking-wide text-muted">Senha</span>
            <input
              type="password"
              name="password"
              required
              autofocus
              placeholder="••••••••"
              class="w-full rounded-lg border border-line bg-press px-3 py-2.5 text-sm outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
            />
          </label>
          <button type="submit" class="primary-button w-full justify-center">Entrar</button>
        </form>

      </div>
    </main>
    <script src="/static/common.js"></script>
  </body>
</html>
